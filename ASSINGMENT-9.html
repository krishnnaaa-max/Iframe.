<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    .con{
     height: 500px;
     width: 800px;
     background-color: navy ;
     display: flex;
     justify-content: center;
     align-items: center;
     margin: auto;
    }
    .box{
        height: 80%;
        width: 80%;
        background-color: skyblue;
        
    }
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .box1{
        height: 80%;
        width: 80%;
        background-color: blue;
        border: 20px solid navy;
        margin: 40px 20px 20px 60px ;
        padding: 60px 20px 20px 80px ;
    }
    .box2{
        height: 80%;
        width: 80%;
        background-color: orange;
    }
    .Hello{
        position: absolute;
        left: 700px;
        top: 100px;
        font-size: 15px;
    }
    .Hello1{
        position: absolute;
        left: 700px;
        top: 130px;
        font-size: 15px;
        color: white;
    }
     .Hello2{
        position: absolute;
        left: 700px;
        top: 170px;
        font-size: 15px;
         color: white;
    }
    .Hello3{
        position: absolute;
        left: 700px;
        top: 270px;
        font-size: 15px;
    }
    </style>
</head>
<body>
    <h1 align="center">Box Plotting</h1>
    <div class="con">
        <div class="box">
            <p class="Hello">Margin</p>
            <div class="box1">
                <p class="Hello1">Border</p>
                <p class="Hello2">Padding</p>
                <div class="box2">
                    <p class="Hello3">Content</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
